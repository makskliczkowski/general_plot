[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "general-plot"
version = "0.2.0"
description = "Publication-quality scientific plotting toolkit based on Matplotlib"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Maksymilian Kliczkowski", email = "maxgrom97@gmail.com" }
]
keywords = [
    "matplotlib",
    "plotting",
    "visualization",
    "publication-quality",
    "science",
    "physics",
    "nature-style",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
extra = [
    "scienceplots>=2.0.0",
    "sympy>=1.10",
    "pandas>=1.3.0",
    "seaborn>=0.11.0",
    "labellines>=0.5.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
all = [
    "general-plot[extra,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["general_plot*"]

[tool.setuptools.package-data]
general_plot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
    "E741",  # ambiguous variable name (e.g., l in physics/math)
    "E402",  # module level import not at top of file
    "F401",  # unused imports in __init__ re-exports
    "F841",  # local variable unused in unpacked tuple
    "I001",  # do not reformat manual import alignment
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["F401", "F841"]

